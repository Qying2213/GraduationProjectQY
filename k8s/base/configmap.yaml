apiVersion: v1
kind: ConfigMap
metadata:
  name: talent-config
  namespace: talent
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: postgres
  DB_NAME: talent_platform
  DB_SSLMODE: disable

  REDIS_HOST: redis
  REDIS_PORT: "6379"

  ES_URL: http://elasticsearch:9200

  USER_SERVICE_URL: http://user-service:8081
  JOB_SERVICE_URL: http://job-service:8082
  INTERVIEW_SERVICE_URL: http://interview-service:8083
  RESUME_SERVICE_URL: http://resume-service:8084
  MESSAGE_SERVICE_URL: http://message-service:8085
  TALENT_SERVICE_URL: http://talent-service:8086
  RECOMMENDATION_SERVICE_URL: http://recommendation-service:8087
  LOG_SERVICE_URL: http://log-service:8088
  MESSAGE_WS_HOST: message-service:8085