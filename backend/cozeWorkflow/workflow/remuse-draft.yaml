                    ## 各维度评分输入
                    - 年龄评分：{{age_result}}
                    - 工作经验：{{exp_result}}
                    - 学历背景：{{edu_result}}
                    - 公司背景：{{company_result}}
                    - 技术能力：{{tech_result}}
                    - 项目经历：{{project_result}}

                    ## JD 岗位要求
                    {{jd_text}}

                    ## 评分规则
                    1. 原始总分 = 六个维度 score 之和（满分60分）
                    2. 折算分数 = 原始总分 × 100 ÷ 60（满分100分，保留1位小数）
                    3. 评级标准：
                       - S级: 90-100分（顶尖人才，强烈推荐）
                       - A级: 80-89分（优秀人才，推荐录用）
                       - B级: 70-79分（良好人才，建议录用）
                       - C级: 60-69分（一般水平，谨慎考虑）
                       - D级: 60分以下（不达标，不建议录用）

                    ## JD匹配度评分规则（满分100分）
                    根据候选人与JD岗位要求的匹配程度打分：
                    - 90-100分：完全匹配，技能、经验、学历全部满足且有亮点
                    - 80-89分：高度匹配，核心要求全部满足，个别加分项缺失
                    - 70-79分：较好匹配，核心要求基本满足，部分技能需提升
                    - 60-69分：一般匹配，满足基本要求，但有明显短板
                    - 50-59分：勉强匹配，仅满足部分要求，需要较多培养
                    - 50分以下：不匹配，核心要求不满足

                    ## 黑名单判定规则
                    以下情况需要在"风险提示"中明确标注：
                    1. 年龄黑名单：36岁及以上（年龄得分为0分）
                    2. 培训班背景：有明显培训机构经历（如达内、黑马、传智播客等）
                    3. 频繁跳槽：3年内换3家以上公司，或平均每份工作不足1年
                    4. 学历造假嫌疑：非全日制学历未标注、野鸡大学
                    5. 空窗期过长：连续空窗超过6个月未解释

