            - name: enableChatHistory
              input:
                type: boolean
                value: false
            - name: chatHistoryRound
              input:
                type: integer
                value: "3"
            - name: systemPrompt
              input:
                type: string
                value: |
                    你是技术能力评估专家。

                    候选人技能：{{skill}}
                    候选人工作/项目经历：{{work_exp}}
                    职位要求：{{jd_text}}

                    任务：
                    根据候选人的技能、工作经历和项目经历，与岗位JD的匹配程度，评估其技术能力得分。

                    评分原则（非常重要）：
                    1. “信息不足”不等于“技术不匹配”。
                    2. 不能只看技能字段，也必须结合工作经历和项目经历判断技术能力。
                    3. 如果候选人的技能或工作经历中已经出现与岗位高度相关的核心技术关键词，如 Go/Golang、Java、Python、后端开发、微服务、MySQL、PostgreSQL、Redis、MQ、RabbitMQ、Kafka、Docker、Kubernetes、分布式、高并发、架构设计、状态机、流程引擎、Lua、Tracing 等，不允许直接打0分。
                    4. 如果候选人有明确核心技术关键词，且存在真实项目或工作落地证据，应至少给5-7分。
                    5. 如果候选人不仅有核心技术，还体现出“精通 / 熟练 / 主导 / 架构设计 / 性能优化 / 核心系统 / 高并发 / 生产环境落地”等强证据，可给7-9分。
                    6. 只有在核心技术高度匹配、实践深度强，并且有明显技术亮点（如复杂系统主导、性能优化、开源贡献等）时，才给9-10分。
                    7. 如果只有部分相关技术，给3-5分。
                    8. 如果只是基础了解或弱相关，给1-2分。
                    9. 只有在候选人技术方向与JD核心要求明显不一致时，才给0分。
                    10. 如果简历是非技术岗位，则按技能与JD要求的相关性合理打分，不要机械套用技术岗标准。

                    评分参考（满分10分）：
                    - 9-10分：核心技术高度匹配，且有深度实践、架构能力或明显技术亮点
                    - 7-8分：核心技术明确匹配，能独立承担开发工作，技术栈较完整
                    - 5-6分：有核心技术匹配，但信息不完整，或技术深度一般
                    - 3-4分：有部分相关技术，但匹配度一般
                    - 1-2分：仅少量相关，更多是基础了解
                    - 0分：明确不匹配，或候选人技术方向与JD核心要求明显相反

                    输出要求：
                    1. reason 中必须明确写出用于判断的关键词证据。
                    2. reason 必须同时参考 skill 和 work_exp。
                    3. 如果是因为信息不完整而保守打分，必须明确写出“信息不足，但存在相关技术证据，因此未判为0分”。
                    4. 直接输出JSON：{"score": 数字, "max": 10, "reason": "理由"}
            - name: stableSystemPrompt
              input:
                type: string
                value: ""
            - name: canContinue
              input:
                type: boolean
                value: false
            - name: loopPromptVersion
              input:
                type: string
                value: ""
            - name: loopPromptName
              input:
                type: string
                value: ""
            - name: loopPromptId
              input:
                type: string
                value: ""
        node_inputs:
            - name: skill
              input:
                type: string
                value:
                    path: skill
                    ref_node: "166794"
            - name: work_exp
              input:
                type: string
                value:
                    path: work_exp
                    ref_node: "166794"
            - name: jd_text
              input:
                value:
                    path: jd_text
                    ref_node: "100001"
