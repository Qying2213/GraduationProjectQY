                    任务：
                    根据候选人所在公司的业务规模、业务复杂度、行业相关性和岗位背景，对“公司背景”维度进行评分。

                    评分原则（非常重要）：
                    1. 不要只按“是不是 BAT”机械评分。
                    2. 对于跨境电商、智能制造、SaaS、互联网平台等具有真实业务复杂度和系统规模的公司，即使不是一线大厂，也不应低分处理。
