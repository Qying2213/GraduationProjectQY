openapi: 3.0.3
info:
  title: 智能人才运营平台 API
  version: 1.1.0
  description: |
    智能人才运营平台完整 OpenAPI 文档，覆盖 API Gateway 对外暴露的 `/api/v1` 接口、
    各微服务健康检查、内部服务接口，以及独立运行的 AI 评估系统接口。

    ## 访问入口
    - 业务 API Gateway: `http://localhost:8080`
    - AI 评估系统: `http://localhost:8090`

    ## 认证方式
    大多数后台管理接口需要 JWT Token：

    ```
    Authorization: Bearer <token>
    ```

    部分内部接口可使用：

    ```
    X-Internal-Token: <INTERNAL_API_KEY>
    ```

    ## 通用响应
    常见 JSON 响应格式为：

    ```json
    {
      "code": 0,
      "message": "success",
      "data": {}
    }
    ```
servers:
  - url: http://localhost:8080
    description: 本地 API Gateway
  - url: http://localhost:8090
    description: 本地 AI 评估系统
tags:
  - name: 网关
    description: Gateway 健康检查与服务发现
  - name: 认证
    description: 注册、登录与当前用户资料
  - name: 用户
    description: 用户管理
  - name: 人才
    description: 人才库管理
  - name: 职位
    description: 职位管理与职位投递查看
  - name: 简历
    description: 简历上传、解析、下载与在线简历
  - name: 投递
    description: 职位投递申请
  - name: AI
    description: 简历 AI 解析、OCR 与智能评估
  - name: 评估
    description: AI 评估结果查询
  - name: 推荐
    description: 人岗推荐、RAG 与语义匹配
  - name: 消息
    description: 系统消息、会话、公告、在线状态与 WebSocket
  - name: 面试
    description: 面试安排、反馈与改期
  - name: 日志
    description: 操作日志查询与清理
  - name: 统计
    description: 仪表盘与招聘统计
  - name: AI评估系统
    description: 独立 AI 简历评估系统接口
  - name: 内部接口
    description: 服务间调用接口

paths:
  /health:
    get:
      tags: [网关]
      summary: Gateway 健康检查
      responses:
        '200':
          description: Gateway 正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  services:
                    type: object
                    additionalProperties:
                      type: string

  /api/v1/register:
    post:
      tags: [认证]
      summary: 用户注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/RegisterSuccess'
        '400':
          $ref: '#/components/responses/Error'

  /api/v1/login:
    post:
      tags: [认证]
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/LoginSuccess'
        '401':
          $ref: '#/components/responses/Error'

  /api/v1/profile:
    get:
      tags: [认证]
      summary: 获取当前用户资料
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 当前用户资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
    put:
      tags: [认证]
      summary: 更新当前用户资料
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  /api/v1/users:
    get:
      tags: [用户]
      summary: 用户列表
      description: 需要 admin/hr/hr_manager/recruiter 角色。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          users:
                            type: array
                            items:
                              $ref: '#/components/schemas/User'
                          total:
                            type: integer
                          page:
                            type: integer
                          page_size:
                            type: integer

  /api/v1/talents:
    get:
      tags: [人才]
      summary: 获取人才列表
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: skills
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: location
          in: query
          schema:
            type: string
        - name: experience
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 人才分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalentListResponse'
    post:
      tags: [人才]
      summary: 创建人才
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Talent'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Talent'

  /api/v1/talents/stats:
    get:
      tags: [人才]
      summary: 获取人才统计
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/talents/search:
    get:
      tags: [人才]
      summary: 搜索人才
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: education
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalentListResponse'

  /api/v1/talents/{id}:
    get:
      tags: [人才]
      summary: 获取人才详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 人才详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Talent'
    put:
      tags: [人才]
      summary: 更新人才
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Talent'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    delete:
      tags: [人才]
      summary: 删除人才
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/jobs:
    get:
      tags: [职位]
      summary: 获取职位列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed, filled, paused]
        - name: type
          in: query
          schema:
            type: string
            enum: [full-time, part-time, contract, internship]
        - name: location
          in: query
          schema:
            type: string
        - name: education
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
        - name: experience
          in: query
          schema:
            type: string
        - name: sort_by
          in: query
          schema:
            type: string
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: 职位分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
    post:
      tags: [职位]
      summary: 创建职位
      description: 需要 admin/hr/hr_manager/recruiter 角色。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Job'

  /api/v1/jobs/stats:
    get:
      tags: [职位]
      summary: 获取职位统计
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/jobs/hot:
    get:
      tags: [职位]
      summary: 获取热门职位
      responses:
        '200':
          description: 热门职位列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/HotJob'

  /api/v1/jobs/{id}:
    get:
      tags: [职位]
      summary: 获取职位详情
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 职位详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Job'
    put:
      tags: [职位]
      summary: 更新职位
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    delete:
      tags: [职位]
      summary: 删除职位
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/jobs/{id}/applications:
    get:
      tags: [职位]
      summary: 获取职位下的投递列表
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 职位投递列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApplicationWithCandidate'

  /api/v1/resumes:
    get:
      tags: [简历]
      summary: 获取简历列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: talent_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 简历分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeListResponse'
    post:
      tags: [简历]
      summary: 创建或上传简历记录
      description: 支持 multipart 文件上传，也兼容 JSON 创建简历记录。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResumeUploadForm'
          application/json:
            schema:
              $ref: '#/components/schemas/Resume'
      responses:
        '201':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/resumes/upload:
    post:
      tags: [简历]
      summary: 登录用户上传简历文件
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResumeUploadForm'
      responses:
        '201':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/resumes/evaluation:
    get:
      tags: [简历]
      summary: 获取待评估简历列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            default: pending
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/resumes/file/{filename}:
    get:
      tags: [简历]
      summary: 获取简历文件
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 文件流
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary

  /api/v1/resumes/online:
    get:
      tags: [简历]
      summary: 获取当前用户在线简历
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 在线简历
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OnlineResumeResponse'
    put:
      tags: [简历]
      summary: 保存当前用户在线简历
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnlineResumeRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/resumes/parse:
    post:
      tags: [简历]
      summary: 解析简历文本
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/resumes/match:
    post:
      tags: [简历]
      summary: 计算简历与职位匹配度
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeMatchRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/resumes/risk-check:
    post:
      tags: [简历]
      summary: 简历风险综合检查
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskCheckRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/resumes/risk-check/time-conflict:
    post:
      tags: [简历]
      summary: 工作经历时间冲突检查
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskCheckRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/resumes/risk-check/education:
    post:
      tags: [简历]
      summary: 教育经历真实性风险检查
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskCheckRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/resumes/{id}:
    get:
      tags: [简历]
      summary: 获取简历详情
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 简历详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Resume'
    delete:
      tags: [简历]
      summary: 删除简历
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/resumes/{id}/download:
    get:
      tags: [简历]
      summary: 下载简历文件
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 文件下载
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /api/v1/resumes/{id}/job:
    put:
      tags: [简历]
      summary: 为简历关联职位
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_id]
              properties:
                job_id:
                  type: integer
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/resumes/{id}/status:
    put:
      tags: [简历]
      summary: 更新简历状态
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, processing, parsed, active, archived, failed]
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/applications:
    get:
      tags: [投递]
      summary: 获取投递列表
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: job_id
          in: query
          schema:
            type: integer
        - name: talent_id
          in: query
          description: 可传 `me` 表示当前登录用户的人才档案。
          schema:
            oneOf:
              - type: integer
              - type: string
                enum: [me]
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 投递列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'
    post:
      tags: [投递]
      summary: 创建职位投递
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Application'
      responses:
        '201':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/applications/{id}:
    put:
      tags: [投递]
      summary: 更新投递状态
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, viewed, interview, offer, rejected]
                notes:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    delete:
      tags: [投递]
      summary: 撤回或删除投递
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/ai/config:
    get:
      tags: [AI]
      summary: 检查 AI 配置
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/ai/current-task:
    get:
      tags: [AI]
      summary: 获取当前 AI 任务
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/ai/evaluate:
    post:
      tags: [AI]
      summary: 根据简历 ID 发起 AI 评估
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIEvaluateRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '503':
          $ref: '#/components/responses/Error'

  /api/v1/ai/evaluate/upload:
    post:
      tags: [AI]
      summary: 上传 PDF 并发起 AI 评估
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                jd_text:
                  type: string
                candidate_name:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /api/v1/ai/evaluate/batch:
    post:
      tags: [AI]
      summary: 批量发起 AI 评估
      requestBody:
        required: true
        content:
          application/json:
