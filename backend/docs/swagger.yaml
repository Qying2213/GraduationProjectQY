components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100

  responses:
    GenericSuccess:
      description: 请求成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Error:
      description: 请求失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RegisterSuccess:
      description: 注册成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
    LoginSuccess:
      description: 登录成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResponse'

  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          nullable: true
      additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 1
        message:
          type: string
          example: error message
        error:
          type: string
      additionalProperties: true

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 6
        role:
          type: string
          enum: [hr, candidate]
          default: candidate
        real_name:
          type: string
        phone:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: 用户名或邮箱
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    ProfileUpdateRequest:
      type: object
      properties:
        real_name:
          type: string
        phone:
          type: string
        avatar:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, hr_manager, recruiter, interviewer, viewer, hr, candidate]
        avatar:
          type: string
        phone:
          type: string
        department:
          type: string
        position:
          type: string
        real_name:
          type: string
        status:
          type: string

    Talent:
      type: object
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        skills:
          type: array
          items:
            type: string
        experience:
          type: integer
        education:
          type: string
        status:
          type: string
        tags:
          type: array
          items:
            type: string
        user_id:
          type: integer
          nullable: true
        location:
          type: string
        salary:
          type: string
        summary:
          type: string
        gender:
          type: string
        age:
          type: integer
        current_company:
          type: string
        current_position:
          type: string
        source:
          type: string
        resume_id:
          type: integer
          nullable: true

    TalentListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                talents:
                  type: array
                  items:
                    $ref: '#/components/schemas/Talent'
                total:
                  type: integer
                page:
                  type: integer
                page_size:
                  type: integer

    Job:
      type: object
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        title:
          type: string
        description:
          type: string
        requirements:
          type: array
          items:
            type: string
        salary:
          type: string
        location:
          type: string
        type:
          type: string
          enum: [full-time, part-time, contract, internship]
        status:
          type: string
          enum: [open, closed, filled, paused]
        created_by:
          type: integer
        department:
          type: string
        level:
          type: string
        education:
          type: string
        skills:
          type: array
          items:
            type: string
        benefits:
          type: array
          items:
            type: string
        headcount:
          type: integer

    HotJob:
      allOf:
        - $ref: '#/components/schemas/Job'
        - type: object
          properties:
            view_count:
              type: integer

    JobListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                jobs:
                  type: array
                  items:
                    $ref: '#/components/schemas/Job'
                total:
                  type: integer
                page:
                  type: integer
                page_size:
                  type: integer

    Resume:
      type: object
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        talent_id:
          type: integer
          nullable: true
        job_id:
          type: integer
          nullable: true
        file_name:
          type: string
        file_path:
          type: string
        file_url:
          type: string
        file_size:
          type: integer
          format: int64
        file_type:
          type: string
        parsed_data:
          type: string
        extracted_text:
          type: string
        match_score:
          type: integer
        status:
          type: string

    ResumeUploadForm:
      type: object
      properties:
        file:
          type: string
          format: binary
        talent_id:
          type: integer
        job_id:
          type: integer

