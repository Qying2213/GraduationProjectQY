      summary: 创建职位投递
      tags:
      - 投递
  /api/v1/applications/{id}:
    delete:
      description: 删除投递申请或求职者撤回申请。
      parameters:
      - description: 投递 ID
        in: path
        name: id
        required: true
        type: integer
