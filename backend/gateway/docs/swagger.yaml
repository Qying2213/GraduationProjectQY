basePath: /
definitions:
  main.SwaggerAny:
    additionalProperties: true
    type: object
  main.SwaggerErrorResponse:
    properties:
      code:
        example: 1
        type: integer
      error:
        type: string
      message:
        example: error message
        type: string
    type: object
  main.SwaggerResponse:
    properties:
      code:
        example: 0
        type: integer
      data: {}
      message:
        example: success
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    基于 Go 微服务架构的智能人才运营平台 API。Swagger 注释文档以 API Gateway 对外暴露的接口为准。
    认证接口以外的大多数后台接口需要在请求头中携带 JWT：Authorization: Bearer <token>。
  title: 智能人才运营平台 API
  version: 1.1.0
paths:
  /api/v1/ai/config:
    get:
      description: 返回 Coze、OCR、RAG 等 AI 能力配置状态。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SwaggerResponse'
      summary: 检查 AI 配置
      tags:
      - AI
  /api/v1/ai/current-task:
    get:
      description: 获取当前正在处理的 AI 评估任务。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SwaggerResponse'
      summary: 获取当前 AI 任务
      tags:
      - AI
  /api/v1/ai/evaluate:
    post:
      consumes:
      - application/json
      description: 基于简历 ID 和 JD 文本或职位 ID 发起 AI 评估。
      parameters:
      - description: 评估参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.SwaggerAny'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SwaggerResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/main.SwaggerErrorResponse'
      summary: 根据简历 ID 发起 AI 评估
      tags:
      - AI
  /api/v1/ai/evaluate/{id}/result:
    get:
      description: 根据评估 ID 获取 AI 评估结果。
      parameters:
      - description: 评估 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SwaggerResponse'
      summary: 获取 AI 评估结果
      tags:
      - AI
  /api/v1/ai/evaluate/batch:
    post:
      consumes:
      - application/json
      description: 按简历 ID 列表批量发起 AI 评估。
      parameters:
      - description: 批量评估参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.SwaggerAny'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SwaggerResponse'
      summary: 批量发起 AI 评估
      tags:
      - AI
  /api/v1/ai/evaluate/upload:
    post:
      consumes:
      - multipart/form-data
      description: 上传 PDF 简历文件并立即进行 AI 评估。
      parameters:
      - description: PDF 简历
        in: formData
        name: file
        required: true
        type: file
      - description: JD 文本
        in: formData
        name: jd_text
        type: string
      - description: 候选人姓名
        in: formData
        name: candidate_name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SwaggerResponse'
      summary: 上传 PDF 并发起 AI 评估
      tags:
      - AI
  /api/v1/ai/ocr:
    post:
      consumes:
      - application/json
      description: 从简历文件中提取文本。
      parameters:
      - description: OCR 参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.SwaggerAny'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SwaggerResponse'
      summary: OCR 文本提取
      tags:
      - AI
  /api/v1/ai/parse:
    post:
      consumes:
      - application/json
      description: 调用 AI 能力解析简历。
      parameters:
      - description: 解析参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.SwaggerAny'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SwaggerResponse'
      summary: AI 智能解析简历
      tags:
      - AI
  /api/v1/applications:
    get:
      description: 查询职位投递列表，talent_id 可传 me 表示当前登录用户。
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 职位 ID
        in: query
        name: job_id
        type: integer
      - description: 人才 ID 或 me
        in: query
        name: talent_id
        type: string
      - description: 投递状态
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SwaggerResponse'
      security:
      - BearerAuth: []
      summary: 获取投递列表
      tags:
      - 投递
    post:
      consumes:
      - application/json
      description: 当前登录求职者投递职位。
      parameters:
