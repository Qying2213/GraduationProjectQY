      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SwaggerResponse'
      security:
      - BearerAuth: []
      summary: 撤回或删除投递
      tags:
      - 投递
    put:
      consumes:
      - application/json
      description: 更新投递申请状态和备注。
      parameters:
      - description: 投递 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 状态参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.SwaggerAny'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SwaggerResponse'
      security:
      - BearerAuth: []
      summary: 更新投递状态
      tags:
      - 投递
