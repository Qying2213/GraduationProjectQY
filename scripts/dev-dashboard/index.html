<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>开发日志大屏</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">GraduationProjectQY</p>
          <h1>后台运行日志大屏</h1>
          <p class="hero-copy">
            每个服务一个独立大面板，直接实时滚动日志，适合边开发边盯启动状态、异常信息和端口监听情况。
          </p>
        </div>
        <div class="hero-actions">
          <button id="refreshButton" class="primary-button" type="button">刷新状态</button>
          <button id="reconnectButton" class="secondary-button" type="button">重连日志流</button>
          <label class="toggle-pill">
            <input id="autoScrollToggle" type="checkbox" checked />
            自动滚动到底部
          </label>
        </div>
      </section>

      <section class="summary-grid">
        <article class="summary-card">
          <span class="summary-label">总服务数</span>
          <strong id="totalCount">0</strong>
        </article>
        <article class="summary-card">
          <span class="summary-label">运行中</span>
          <strong id="runningCount">0</strong>
        </article>
        <article class="summary-card">
          <span class="summary-label">启动中</span>
          <strong id="startingCount">0</strong>
        </article>
        <article class="summary-card">
          <span class="summary-label">已停止</span>
          <strong id="stoppedCount">0</strong>
        </article>
      </section>

      <section class="toolbar">
        <div class="toolbar-meta">
          <span id="dashboardPort">开发面板端口：--</span>
          <span id="lastUpdated">最后刷新：--</span>
          <span id="streamStatus">实时日志：--</span>
        </div>
      </section>

      <section class="wallboard" id="serviceWallboard"></section>
    </main>

    <script src="./app.js"></script>
  </body>
  </html>
