# ============================================================
# 部署工作流 - 使用 docker-compose 部署
# 状态: 已禁用 (手动触发)
# ============================================================

name: Deploy

# 已禁用自动触发，仅支持手动触发
on:
  workflow_dispatch:  # 仅手动触发

# on:
#   push:
#     branches:
#       - main
#   workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy with docker-compose
        run: |
          # 停止旧容器
          docker compose down || true
          
          # 重新构建并启动
          docker compose up -d --build
          
          echo "✅ 部署完成！"
      
      - name: Show running containers
        run: |
          docker compose ps

