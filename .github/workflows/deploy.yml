# ============================================================
# 部署工作流配置文件
# 文件位置: .github/workflows/deploy.yml
# 作用: 构建 Docker 镜像并部署到服务器
# ============================================================

name: Deploy

# 触发条件
on:
  # 只在 main 分支推送时触发部署
  push:
    branches:
      - main
  
  # workflow_dispatch: 允许手动触发
  # 在 GitHub Actions 页面会出现 "Run workflow" 按钮
  workflow_dispatch:

# 环境变量，整个工作流都可以使用
env:
  REGISTRY: docker.io                    # Docker 仓库地址
  IMAGE_NAME: talent-platform            # 镜像名称前缀

jobs:
  # ==================== Job 1: 构建并推送镜像 ====================
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 步骤1: 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 步骤2: 登录 Docker Hub
      # secrets.XXX 是从 GitHub Secrets 读取的敏感信息
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}   # 从 Secrets 读取用户名
          password: ${{ secrets.DOCKER_PASSWORD }}   # 从 Secrets 读取密码/Token
      
      # 步骤3: 构建并推送 Gateway 镜像
      - name: Build and push Gateway
        run: |
          # 构建镜像，-t 指定镜像名称和标签
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}-gateway:latest ./backend/gateway
          # 推送到 Docker Hub
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}-gateway:latest
      
      # 步骤4: 构建并推送 User Service 镜像
      - name: Build and push User Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}-user-service:latest ./backend/user-service
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}-user-service:latest
      
      # 步骤5: 构建并推送其他服务（按需添加）
      # - name: Build and push Job Service
      #   run: |
      #     docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}-job-service:latest ./backend/job-service
      #     docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}-job-service:latest

  # ==================== Job 2: 部署到服务器 ====================
  deploy:
    # needs: 指定依赖，build 完成后才执行 deploy
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      # 步骤1: 通过 SSH 连接服务器并执行部署命令
      # appleboy/ssh-action 是一个第三方 Action，用于 SSH 连接
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}       # 服务器 IP 地址
          username: ${{ secrets.SERVER_USER }}   # SSH 用户名
          key: ${{ secrets.SERVER_SSH_KEY }}     # SSH 私钥
          script: |
            # 以下命令在服务器上执行
            
            # 进入项目目录
            cd /opt/talent-platform
            
            # 拉取最新镜像
            docker-compose pull
            
            # 重启服务（-d 后台运行）
            docker-compose up -d
            
            # 清理旧镜像，释放磁盘空间
            docker image prune -f
            
            # 输出部署完成信息
            echo "✅ Deploy completed at $(date)"

# ============================================================
# 使用前需要配置的 GitHub Secrets:
# 
# 1. DOCKER_USERNAME  - Docker Hub 用户名
# 2. DOCKER_PASSWORD  - Docker Hub Access Token
# 3. SERVER_HOST      - 服务器 IP 地址
# 4. SERVER_USER      - SSH 登录用户名
# 5. SERVER_SSH_KEY   - SSH 私钥内容
#
# 配置路径: 仓库 Settings → Secrets and variables → Actions
# ============================================================
