<svg width="1500" height="620" viewBox="0 0 1500 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowAI" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px "Microsoft YaHei", "PingFang SC", sans-serif; fill:#0f172a; }
      .box { rx:16; ry:16; stroke-width:2.5; }
      .boxTitle { font: 700 18px "Microsoft YaHei", "PingFang SC", sans-serif; fill:#111827; }
      .boxText { font: 14px "Microsoft YaHei", "PingFang SC", sans-serif; fill:#374151; }
      .line { stroke:#475569; stroke-width:2.5; fill:none; marker-end:url(#arrowAI); }
      .note { font: 14px "Microsoft YaHei", "PingFang SC", sans-serif; fill:#6b7280; }
    </style>
  </defs>

  <text x="750" y="42" text-anchor="middle" class="title">AI 智能评估流程图</text>
  <text x="750" y="72" text-anchor="middle" class="note">OCR、Embedding、RAG 与 Coze 工作流联合评估链路</text>

  <rect x="70" y="210" width="190" height="100" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="165" y="245" text-anchor="middle" class="boxTitle">OCR / 文本提取</text>
  <text x="165" y="272" text-anchor="middle" class="boxText">生成 resume_text</text>

  <rect x="320" y="210" width="200" height="100" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="420" y="245" text-anchor="middle" class="boxTitle">Embedding 向量化</text>
  <text x="420" y="272" text-anchor="middle" class="boxText">生成文本向量表示</text>

  <rect x="580" y="210" width="200" height="100" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="680" y="245" text-anchor="middle" class="boxTitle">RAG 检索增强</text>
  <text x="680" y="272" text-anchor="middle" class="boxText">查询相似人才上下文</text>

  <rect x="840" y="210" width="230" height="100" class="box" fill="#fee2e2" stroke="#ef4444"/>
  <text x="955" y="245" text-anchor="middle" class="boxTitle">Coze 工作流评估</text>
  <text x="955" y="272" text-anchor="middle" class="boxText">resume_text + resume_file + jd_text</text>

  <rect x="1130" y="210" width="250" height="100" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="1255" y="245" text-anchor="middle" class="boxTitle">结构化评估结果</text>
  <text x="1255" y="272" text-anchor="middle" class="boxText">评分、解释、录用建议</text>

  <rect x="540" y="410" width="420" height="100" class="box" fill="#ffffff" stroke="#94a3b8"/>
  <text x="750" y="445" text-anchor="middle" class="boxTitle">过程追踪与结果存储</text>
  <text x="750" y="472" text-anchor="middle" class="boxText">ai_process_logs：过程日志</text>
  <text x="750" y="495" text-anchor="middle" class="boxText">evaluation_results：结构化结果</text>

  <path d="M260 260 L320 260" class="line"/>
  <path d="M520 260 L580 260" class="line"/>
  <path d="M780 260 L840 260" class="line"/>
  <path d="M1070 260 L1130 260" class="line"/>
  <path d="M955 310 L955 360 L750 360 L750 410" class="line"/>
</svg>
