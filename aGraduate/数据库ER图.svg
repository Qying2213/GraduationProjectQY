<svg width="1500" height="1120" viewBox="0 0 1500 1120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowER" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px "Microsoft YaHei", "PingFang SC", sans-serif; fill:#0f172a; }
      .box-title { font: 700 16px "Microsoft YaHei", "PingFang SC", sans-serif; fill:#111827; }
      .field { font: 13px "Microsoft YaHei", "PingFang SC", sans-serif; fill:#374151; }
      .edge { stroke:#475569; stroke-width:2.4; fill:none; marker-end:url(#arrowER); }
    </style>
  </defs>

  <text x="750" y="40" text-anchor="middle" class="title">智能人才运营平台核心数据库 ER 图</text>

  <!-- users -->
  <rect x="610" y="80" width="280" height="170" rx="12" ry="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2.2"/>
  <line x1="610" y1="118" x2="890" y2="118" stroke="#4338ca" stroke-width="2"/>
  <text x="750" y="105" text-anchor="middle" class="box-title">users</text>
  <text x="630" y="145" class="field">id (PK)</text>
  <text x="630" y="170" class="field">username</text>
  <text x="630" y="195" class="field">email</text>
  <text x="630" y="220" class="field">password / role / real_name</text>

  <!-- jobs -->
  <rect x="120" y="330" width="300" height="200" rx="12" ry="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
  <line x1="120" y1="368" x2="420" y2="368" stroke="#2563eb" stroke-width="2"/>
  <text x="270" y="355" text-anchor="middle" class="box-title">jobs</text>
  <text x="140" y="395" class="field">id (PK)</text>
  <text x="140" y="420" class="field">title</text>
  <text x="140" y="445" class="field">description</text>
  <text x="140" y="470" class="field">requirements[]</text>
  <text x="140" y="495" class="field">skills[] / salary / location</text>

  <!-- talents -->
  <rect x="590" y="330" width="320" height="210" rx="12" ry="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2.2"/>
  <line x1="590" y1="368" x2="910" y2="368" stroke="#0891b2" stroke-width="2"/>
  <text x="750" y="355" text-anchor="middle" class="box-title">talents</text>
  <text x="610" y="395" class="field">id (PK)</text>
  <text x="610" y="420" class="field">name / email / phone</text>
  <text x="610" y="445" class="field">skills[] / experience / education</text>
  <text x="610" y="470" class="field">location / salary / summary</text>
  <text x="610" y="495" class="field">user_id (FK)</text>

  <!-- messages -->
  <rect x="1080" y="330" width="280" height="180" rx="12" ry="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2.2"/>
  <line x1="1080" y1="368" x2="1360" y2="368" stroke="#db2777" stroke-width="2"/>
  <text x="1220" y="355" text-anchor="middle" class="box-title">messages</text>
  <text x="1100" y="395" class="field">id (PK)</text>
  <text x="1100" y="420" class="field">sender_id (FK)</text>
  <text x="1100" y="445" class="field">receiver_id (FK)</text>
  <text x="1100" y="470" class="field">title / content / is_read</text>

  <!-- resumes -->
  <rect x="560" y="610" width="380" height="230" rx="12" ry="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
  <line x1="560" y1="648" x2="940" y2="648" stroke="#16a34a" stroke-width="2"/>
  <text x="750" y="635" text-anchor="middle" class="box-title">resumes</text>
  <text x="580" y="675" class="field">id (PK)</text>
  <text x="580" y="700" class="field">talent_id (FK)</text>
  <text x="580" y="725" class="field">job_id (FK)</text>
  <text x="580" y="750" class="field">file_name / file_path</text>
  <text x="580" y="775" class="field">extracted_text / parsed_data</text>
  <text x="580" y="800" class="field">match_score / status</text>

  <!-- applications -->
  <rect x="120" y="640" width="320" height="200" rx="12" ry="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2"/>
  <line x1="120" y1="678" x2="440" y2="678" stroke="#ea580c" stroke-width="2"/>
  <text x="280" y="665" text-anchor="middle" class="box-title">applications</text>
  <text x="140" y="705" class="field">id (PK)</text>
  <text x="140" y="730" class="field">talent_id (FK)</text>
  <text x="140" y="755" class="field">job_id (FK)</text>
  <text x="140" y="780" class="field">resume_id (FK)</text>
  <text x="140" y="805" class="field">status / cover_letter / notes</text>

  <!-- interviews -->
  <rect x="1070" y="640" width="320" height="200" rx="12" ry="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2.2"/>
  <line x1="1070" y1="678" x2="1390" y2="678" stroke="#ca8a04" stroke-width="2"/>
  <text x="1230" y="665" text-anchor="middle" class="box-title">interviews</text>
  <text x="1090" y="705" class="field">id (PK)</text>
  <text x="1090" y="730" class="field">candidate_id (FK)</text>
  <text x="1090" y="755" class="field">position_id (FK)</text>
  <text x="1090" y="780" class="field">interviewer_id (FK)</text>
  <text x="1090" y="805" class="field">date / time / status</text>

  <!-- evaluation_results -->
  <rect x="390" y="930" width="360" height="200" rx="12" ry="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.2"/>
  <line x1="390" y1="968" x2="750" y2="968" stroke="#7c3aed" stroke-width="2"/>
  <text x="570" y="955" text-anchor="middle" class="box-title">evaluation_results</text>
  <text x="410" y="995" class="field">id (PK)</text>
  <text x="410" y="1020" class="field">resume_id / talent_id / job_id</text>
  <text x="410" y="1045" class="field">parsed_name / parsed_school</text>
  <text x="410" y="1070" class="field">match_score / match_details</text>
  <text x="410" y="1095" class="field">parsed_report / raw_result</text>

  <!-- ai_process_logs -->
  <rect x="860" y="930" width="320" height="190" rx="12" ry="12" fill="#fdf4ff" stroke="#a21caf" stroke-width="2.2"/>
  <line x1="860" y1="968" x2="1180" y2="968" stroke="#a21caf" stroke-width="2"/>
  <text x="1020" y="955" text-anchor="middle" class="box-title">ai_process_logs</text>
  <text x="880" y="995" class="field">id (PK)</text>
  <text x="880" y="1020" class="field">evaluation_id (FK)</text>
  <text x="880" y="1045" class="field">resume_id (FK)</text>
  <text x="880" y="1070" class="field">status</text>
  <text x="880" y="1095" class="field">process_trace / error_msg</text>

  <!-- edges -->
  <path d="M750 250 L750 330" class="edge"/>
  <path d="M680 250 L270 250 L270 330" class="edge"/>
  <path d="M820 250 L1220 250 L1220 330" class="edge"/>

  <path d="M270 530 L270 640" class="edge"/>
  <path d="M750 540 L750 610" class="edge"/>
  <path d="M1220 510 L1220 640" class="edge"/>

  <path d="M420 430 L560 430 L560 660" class="edge"/>
  <path d="M590 430 L590 610" class="edge"/>

  <path d="M440 740 L560 740" class="edge"/>
  <path d="M910 740 L1070 740" class="edge"/>

  <path d="M660 840 L660 930" class="edge"/>
  <path d="M840 840 L840 1000 L860 1000" class="edge"/>
  <path d="M750 1020 L860 1020" class="edge"/>
</svg>
