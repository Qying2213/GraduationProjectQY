<svg width="1500" height="620" viewBox="0 0 1500 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowResume" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px "Microsoft YaHei", "PingFang SC", sans-serif; fill:#0f172a; }
      .box { rx:16; ry:16; stroke-width:2.5; }
      .boxTitle { font: 700 18px "Microsoft YaHei", "PingFang SC", sans-serif; fill:#111827; }
      .boxText { font: 14px "Microsoft YaHei", "PingFang SC", sans-serif; fill:#374151; }
      .line { stroke:#475569; stroke-width:2.5; fill:none; marker-end:url(#arrowResume); }
      .note { font: 14px "Microsoft YaHei", "PingFang SC", sans-serif; fill:#6b7280; }
    </style>
  </defs>

  <text x="750" y="42" text-anchor="middle" class="title">简历智能处理流程图</text>
  <text x="750" y="72" text-anchor="middle" class="note">从原始文件到结构化评估信息的处理流程</text>

  <rect x="70" y="210" width="180" height="100" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="160" y="245" text-anchor="middle" class="boxTitle">原始简历文件</text>
  <text x="160" y="272" text-anchor="middle" class="boxText">PDF / DOC / DOCX</text>

  <rect x="300" y="210" width="190" height="100" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="395" y="245" text-anchor="middle" class="boxTitle">格式识别</text>
  <text x="395" y="272" text-anchor="middle" class="boxText">判断文本型 / 扫描型</text>

  <rect x="540" y="120" width="190" height="90" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="635" y="155" text-anchor="middle" class="boxTitle">文本型 PDF 提取</text>
  <text x="635" y="180" text-anchor="middle" class="boxText">pdftotext / go-pdf</text>

  <rect x="540" y="300" width="190" height="90" class="box" fill="#fee2e2" stroke="#ef4444"/>
  <text x="635" y="335" text-anchor="middle" class="boxTitle">扫描件 OCR</text>
  <text x="635" y="360" text-anchor="middle" class="boxText">图片化处理 + OCR</text>

  <rect x="790" y="210" width="190" height="100" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="885" y="245" text-anchor="middle" class="boxTitle">文本清洗</text>
  <text x="885" y="272" text-anchor="middle" class="boxText">归一化 / 去水印 / 去噪</text>

  <rect x="1030" y="210" width="190" height="100" class="box" fill="#ecfeff" stroke="#0891b2"/>
  <text x="1125" y="245" text-anchor="middle" class="boxTitle">结构化提取</text>
  <text x="1125" y="272" text-anchor="middle" class="boxText">姓名 / 学历 / 工作经历等</text>

  <rect x="1270" y="210" width="160" height="100" class="box" fill="#ffffff" stroke="#64748b"/>
  <text x="1350" y="245" text-anchor="middle" class="boxTitle">风控校验</text>
  <text x="1350" y="272" text-anchor="middle" class="boxText">时间冲突 / 异常提示</text>

  <rect x="1030" y="430" width="400" height="90" class="box" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1230" y="465" text-anchor="middle" class="boxTitle">输出结果</text>
  <text x="1230" y="492" text-anchor="middle" class="boxText">提取文本、结构化字段、风险提示、评估输入文本</text>

  <path d="M250 260 L300 260" class="line"/>
  <path d="M490 260 L540 165" class="line"/>
  <path d="M490 260 L540 345" class="line"/>
  <path d="M730 165 L790 245" class="line"/>
  <path d="M730 345 L790 275" class="line"/>
  <path d="M980 260 L1030 260" class="line"/>
  <path d="M1220 260 L1270 260" class="line"/>
  <path d="M1350 310 L1350 360 L1230 360 L1230 430" class="line"/>
</svg>
