# ============================================================
# 智能人才运营平台 - Docker Compose 配置
# 使用方式: docker compose up -d
# ============================================================

version: '3.8'

services:
  # ==================== 数据库服务 ====================
  
  # PostgreSQL 数据库
  postgres:
    image: postgres:14-alpine
    container_name: talent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talent_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/database/init_data.sql:/docker-entrypoint-initdb.d/02-init-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talent-network
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: talent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - talent-network
    restart: unless-stopped

  # Elasticsearch 日志存储
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: talent-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - talent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==================== 后端服务 ====================
  
  # 所有后端微服务（一个容器）
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talent-backend
    ports:
      - "8080:8080"   # Gateway
      - "8081:8081"   # User Service
      - "8082:8082"   # Job Service
      - "8083:8083"   # Interview Service
      - "8084:8084"   # Resume Service
      - "8085:8085"   # Message Service
      - "8086:8086"   # Talent Service
      - "8087:8087"   # Recommendation Service
      - "8088:8088"   # Log Service
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=talent_platform
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - JWT_SECRET=${JWT_SECRET:-talent-platform-jwt-secret-2024}
    volumes:
      - ./backend/resume-service/uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      talent-network:
        aliases:
          - gateway
    restart: unless-stopped

  # ==================== 前端服务 ====================
  
  # Vue 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talent-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - talent-network
    restart: unless-stopped

# ==================== 网络配置 ====================
networks:
  talent-network:
    driver: bridge

# ==================== 数据卷 ====================
volumes:
  postgres_data:
    name: talent-postgres-data
  redis_data:
    name: talent-redis-data
  es_data:
    name: talent-es-data
